<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>Fono-IA Muestras</title>
<style>
:root{--bg:#f3f6f7;--panel:#fff;--fg:#14232b;--muted:#5b6d76;--line:#d6e0e4;--accent:#0f6e8c;--accent-fg:#fff;--bad:#c9443a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f171b;--panel:#162228;--fg:#e6eef1;--muted:#93a6ae;--line:#2a3a42;--accent:#4cb3d4;--accent-fg:#06222c;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;
 padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0}
input[type=password]{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
button{font:inherit;font-weight:700;font-size:17px;border-radius:12px;border:1px solid var(--accent);padding:14px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.5}
label.r{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.err{color:var(--bad);font-size:15px;min-height:1.4em;margin:0}
</style></head>
<body>
<form id="f" autocomplete="on">
  <h1>Fono-IA · Toma de muestras</h1>
  <input type="password" id="k" placeholder="Clave de acceso" autocomplete="current-password" required>
  <label class="r"><input type="checkbox" id="rec" checked> Recordar en este equipo</label>
  <button id="b">Entrar</button>
  <p class="err" id="e"></p>
</form>

<script>
"use strict";
(function(){
  var d = document.getElementById("fonoia-cifrado");
  var u8 = function(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  var salt = u8(d.dataset.salt), iv = u8(d.dataset.iv), ct = u8(d.textContent.trim()), iter = parseInt(d.dataset.iter, 10);
  var KEY = "fonoia-llave-" + d.dataset.salt.slice(0, 12);
  var err = document.getElementById("e");
  if (!window.crypto || !crypto.subtle) { err.textContent = "Este navegador no permite abrir la app. Use Safari (iPhone) o Chrome."; return; }
  function abrir(key){
    return crypto.subtle.decrypt({name:"AES-GCM", iv: iv}, key, ct).then(function(buf){
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    });
  }
  function guardada(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } }
  var g = guardada();
  if (g) {
    crypto.subtle.importKey("raw", u8(g), "AES-GCM", false, ["decrypt"]).then(abrir).catch(function(){
      try { localStorage.removeItem(KEY); } catch(e){}
    });
  }
  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    var b = document.getElementById("b"); b.disabled = true; err.textContent = "Abriendo…";
    var rec = document.getElementById("rec").checked;
    crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("k").value), "PBKDF2", false, ["deriveKey"])
      .then(function(base){ return crypto.subtle.deriveKey({name:"PBKDF2", salt: salt, iterations: iter, hash:"SHA-256"}, base,
        {name:"AES-GCM", length:256}, true, ["decrypt"]); })
      .then(function(key){
        return crypto.subtle.decrypt({name:"AES-GCM", iv: iv}, key, ct).then(function(){
          if (rec) return crypto.subtle.exportKey("raw", key).then(function(raw){
            var s = "", a = new Uint8Array(raw); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
            try { localStorage.setItem(KEY, btoa(s)); } catch(e){}
          });
        }).then(function(){ return abrir(key); });
      })
      .catch(function(){ err.textContent = "Clave incorrecta. Intente de nuevo."; b.disabled = false; });
  });
})();
</script>
